<div style="max-width: 720px; margin: 40px auto; font-family: system-ui, sans-serif; padding: 0 20px; color: #1e293b;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px;">
    <div>
      <h1 style="margin: 0; font-size: 22px;">Smart Workspace</h1>
      <p style="margin: 4px 0 0; color: #64748b; font-size: 14px;">Monitoring ergonomique & environnemental</p>
    </div>
    <span *ngIf="data" style="background: #dcfce7; color: #166534; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;">
      ● En direct
    </span>
  </div>

  <div *ngIf="data" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
    
    <div [style.background]="data.distance < 40 ? '#fef2f2' : '#f0fdf4'"
         [style.border]="data.distance < 40 ? '1px solid #fecaca' : '1px solid #bbf7d0'"
         style="grid-column: span 2; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span style="font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 600;">Posture</span>
        <h2 style="margin: 6px 0 0; font-size: 20px;" [style.color]="data.distance < 40 ? '#dc2626' : '#16a34a'">
          {{ data.posture }}
        </h2>
      </div>
      <div style="text-align: right;">
        <span style="font-size: 13px; color: #64748b;">Distance écran</span>
        <div style="font-size: 28px; font-weight: 700;">{{ data.distance }} cm</div>
      </div>
    </div>

    <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px;">
      <span style="font-size: 13px; color: #64748b; font-weight: 600;">Température</span>
      <div style="font-size: 30px; font-weight: 700; margin-top: 8px;">{{ data.temperature }} °C</div>
    </div>

    <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px;">
      <span style="font-size: 13px; color: #64748b; font-weight: 600;">Humidité</span>
      <div style="font-size: 30px; font-weight: 700; margin-top: 8px;">{{ data.humidite }} %</div>
    </div>

  </div>

  <div *ngIf="!data" style="text-align: center; padding: 40px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; color: #64748b;">
    En attente des données sur <strong>/capteurs.json</strong>...
  </div>

</div>
