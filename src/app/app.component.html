<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px;">
  <h1>Smart Workspace</h1>

  <div *ngIf="userData" style="background: #f4f4f9; padding: 20px; border-radius: 8px;">
    <h2>Profil Firebase</h2>
    <p><strong>Nom :</strong> {{ userData.nom }}</p>
    <p><strong>Prénom :</strong> {{ userData.prenom }}</p>
  </div>

  <div *ngIf="!userData">
    <p>Chargement des données...</p>
  </div>
</div>
